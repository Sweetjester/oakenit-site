<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Light-mode variant of the placeholder OakenIT mark.
       Warm parchment background, deeper oak tones for contrast. -->
  <rect width="400" height="400" fill="#fbf6ea" rx="72"/>

  <!-- Canopy (three overlapping oak leaves as circles) -->
  <circle cx="160" cy="140" r="72" fill="#8b6d47"/>
  <circle cx="240" cy="140" r="72" fill="#6d5439"/>
  <circle cx="200" cy="100" r="60" fill="#a68158"/>
  <circle cx="130" cy="180" r="52" fill="#503d29"/>
  <circle cx="270" cy="180" r="52" fill="#503d29"/>

  <!-- Trunk -->
  <rect x="185" y="200" width="30" height="130" rx="4" fill="#3f2f20"/>

  <!-- Root ground line -->
  <path d="M 130 330 Q 200 340 270 330" stroke="#8b6d47" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Wordmark below -->
  <text x="200" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="600">
    <tspan fill="#6d5439">Oaken</tspan><tspan fill="#24201a">IT</tspan>
  </text>
</svg>
