    <path d="M50 46.4 V61.2 M50 46.4 L61.5 61.2 M50 46.4 L38.5 61.2" stroke-width="0.7" opacity="0.4"/>
    <path d="M27 61.5 H73 L70.5 66 H29.5 Z" stroke-width="1.2" opacity="0.92"/>

