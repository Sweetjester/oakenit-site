    <path d="M42.8 66.6 L41.4 125.4 M57.2 66.6 L58.6 125.4" stroke-width="0.8" opacity="0.6"/>
    <path d="M30.6 77 H69.4" stroke-width="0.7" opacity="0.35"/>

