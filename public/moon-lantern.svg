<?xml version="1.0" encoding="UTF-8"?>
<!--
  OakenIT hanging lantern — standalone asset, for dropping into logo artwork.
  Kept in step with components/MoonLantern.tsx; regenerate this whenever that
  component changes. Redrawn 2026-09-03 from a brass hoop-and-globe to the
  hexagonal carriage lantern that matches the tree illustration.
  Stroke is a fixed gold rather than currentColor, since this is used outside
  the site where currentColor has nothing to inherit from.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 14 56 136" fill="none">
  <defs>
    <linearGradient id="glass" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f7c04a" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#fff6de" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d4820c" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffdb8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffdb8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0%" stop-color="#fffaeb" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ffd479" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f7c04a" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <g stroke="#c8890f" fill="none" stroke-linecap="round" stroke-linejoin="round">
