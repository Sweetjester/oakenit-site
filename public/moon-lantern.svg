    <line x1="50" y1="27" x2="50" y2="38.5" stroke-width="1" opacity="0.65"/>

    <ellipse cx="50" cy="96" rx="31" ry="35" fill="url(#halo)" stroke="none"/>

    <circle cx="50" cy="42" r="3.5" stroke-width="1.2" opacity="0.95" fill="#c8890f" fill-opacity="0.22"/>

    <path d="M50 45.8 C 58.5 50.5, 66 56, 69.5 61.5 H30.5 C 34 56, 41.5 50.5, 50 45.8 Z"
