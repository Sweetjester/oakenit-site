    <path d="M50 92.5 c 2.6 3.6, 2.6 6.8, 0 9.8 c -2.6 -3, -2.6 -6.2, 0 -9.8 Z" fill="#fffdf5" fill-opacity="0.7" stroke="none"/>

    <path d="M31.5 126 H68.5 L66 131 H34 Z" stroke-width="1.2" opacity="0.92"/>
